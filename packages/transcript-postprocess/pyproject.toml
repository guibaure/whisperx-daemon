[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-postprocess"
version = "0.1.0"
description = "Reusable transcript pseudonymisation and term replacement tools"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
ner = [
    "sentencepiece>=0.2.0",
    "transformers>=4.47",
]

[project.scripts]
transcript-postprocess = "transcript_postprocess.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
