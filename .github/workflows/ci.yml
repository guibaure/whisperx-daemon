name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Synchronise uv environment
        run: uv sync --python ${{ matrix.python-version }} --group dev --all-packages

      - name: Run repository test suite
        run: make test

      - name: Verify standalone CLI help
        run: |
          uv run python -m whisperx_daemon --help
          uv run python -m whisperx_daemon.standalone --help
          uv run python -m transcript_postprocess --help

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Synchronise uv environment
        run: uv sync --python 3.11 --group dev --all-packages

      - name: Run Ruff lint checks
        run: make lint

      - name: Run Ruff formatting checks
        run: make format-check

      - name: Run mypy
        run: make typecheck

  package:
    name: Package Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Synchronise uv environment
        run: uv sync --python 3.11 --group dev --all-packages

      - name: Build whisperx-daemon distribution
        run: uv build --package whisperx-daemon

      - name: Build transcript-postprocess distribution
        run: uv build --package transcript-postprocess

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t whisperx-daemon:ci .
