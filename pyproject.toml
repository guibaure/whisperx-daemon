[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperx-daemon"
version = "0.1.0"
description = "Local-first audio transcription daemon scaffold"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "transcript-postprocess[ner]",
    "torchcodec>=0.7,<0.8",
]

[project.scripts]
whisperx-daemon = "whisperx_daemon.cli:main"

[project.optional-dependencies]
cpu = [
    "whisperx==3.8.4",
    "torch==2.8.0",
    "torchaudio==2.8.0",
]
gpu = [
    "whisperx==3.8.4",
    "torch==2.8.0",
    "torchaudio==2.8.0",
]

[dependency-groups]
dev = [
    "coverage[toml]==7.13.5",
    "mypy==1.18.2",
    "ruff==0.12.10",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
transcript-postprocess = { workspace = true }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]

[tool.uv.workspace]
members = ["packages/transcript-postprocess"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "packages/transcript-postprocess/src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = [
    "src/whisperx_daemon",
    "packages/transcript-postprocess/src/transcript_postprocess",
]
omit = [
    "*/__init__.py",
    "*/__main__.py",
]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
files = [
    "src/whisperx_daemon/app.py",
    "src/whisperx_daemon/cli.py",
    "src/whisperx_daemon/config.py",
    "src/whisperx_daemon/filesystem.py",
    "src/whisperx_daemon/state.py",
    "src/whisperx_daemon/streaming.py",
    "src/whisperx_daemon/watcher.py",
    "packages/transcript-postprocess/src/transcript_postprocess/cli.py",
]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
