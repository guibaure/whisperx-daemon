[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperx-daemon"
version = "0.1.0"
description = "Local-first audio transcription daemon scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "whisperx==3.8.4",
    "torchcodec>=0.7,<0.8",
]

[project.optional-dependencies]
cpu = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
]
gpu = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
]
dev = [
    "mypy==1.18.2",
    "ruff==0.12.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "packages/transcript-postprocess/src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = [
    "src/whisperx_daemon/app.py",
    "src/whisperx_daemon/cli.py",
    "src/whisperx_daemon/config.py",
    "src/whisperx_daemon/filesystem.py",
    "src/whisperx_daemon/state.py",
    "src/whisperx_daemon/watcher.py",
    "packages/transcript-postprocess/src/transcript_postprocess/cli.py",
]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
